plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.devcourse'
version = '0.0.1-SNAPSHOT'

// 컴파일 대상은 Java 25. 설치된 JDK가 25 이상이면 그대로 빌드됩니다.
tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 테스트가 데이터 디렉터리를 따로 지정하지 않아도 저장소의 ./data(로컬 실행 데이터)를 건드리지 않게 한다.
	environment 'CHZZK_DATA_DIR', layout.buildDirectory.dir('test-data').get().asFile.absolutePath

	// 그래도 테스트가 ./data 를 새로 만들면 실패시킨다 (docs/agents/assignment-workflow.md '함정' 참고).
	def repoDataDir = file('data')
	def dataDirExisted = false
	doFirst { dataDirExisted = repoDataDir.exists() }
	doLast {
		if (!dataDirExisted && repoDataDir.exists()) {
			throw new GradleException('테스트가 저장소의 ./data 를 만들었습니다. 테스트는 @TempDir 또는 --chzzk.data-dir 인자로 임시 디렉터리를 써야 합니다.')
		}
	}
}
