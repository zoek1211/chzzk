spring.application.name=chzzk

# 모든 런타임 데이터(DB 파일, 업로드한 영상)가 들어가는 디렉터리
chzzk.data-dir=${CHZZK_DATA_DIR:./data}
chzzk.storage.video-dir=${chzzk.data-dir}/videos

# 파일 기반 H2: 재시작 후에도 녹화방송 정보가 남습니다
spring.datasource.url=jdbc:h2:file:${chzzk.data-dir}/chzzk
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# 업로드 크기 제한
spring.servlet.multipart.max-file-size=${CHZZK_MAX_UPLOAD_SIZE:2GB}
spring.servlet.multipart.max-request-size=${CHZZK_MAX_UPLOAD_SIZE:2GB}
