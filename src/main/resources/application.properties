spring.application.name=chzzk

# 모든 런타임 데이터(DB 파일, 업로드한 영상)가 들어가는 디렉터리
chzzk.data-dir=${CHZZK_DATA_DIR:./data}
chzzk.storage.video-dir=${chzzk.data-dir}/videos

# 파일 기반 H2: 재시작 후에도 녹화방송 정보가 남습니다
spring.datasource.url=jdbc:h2:file:${chzzk.data-dir}/chzzk
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# WebRTC ICE 서버: STUN 기본값은 공개 서버, TURN은 선택 (비밀 값은 환경변수로만 설정)
chzzk.ice.stun-url=${CHZZK_STUN_URL:stun:stun.l.google.com:19302}
chzzk.ice.turn-url=${CHZZK_TURN_URL:}
chzzk.ice.turn-username=${CHZZK_TURN_USERNAME:}
chzzk.ice.turn-credential=${CHZZK_TURN_CREDENTIAL:}

# 시청 정원: 라이브 방송 하나를 동시에 볼 수 있는 시청자 수
chzzk.live.viewer-capacity=${CHZZK_VIEWER_CAPACITY:5}

# 라이브를 시작한 뒤 이 시간 안에 방송자가 송출 키로 인증하지 않으면 방송이 종료가 됩니다
chzzk.live.broadcaster-join-timeout=${CHZZK_BROADCASTER_JOIN_TIMEOUT:30s}

# HTTPS (선택, 기본 꺼짐=HTTP). 휴대폰 카메라는 HTTPS에서만 열립니다. 키스토어와 비밀번호는 저장소에 두지 않습니다.
server.ssl.enabled=${CHZZK_SSL_ENABLED:false}
server.ssl.key-store=${CHZZK_SSL_KEY_STORE:}
server.ssl.key-store-password=${CHZZK_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${CHZZK_SSL_KEY_STORE_TYPE:PKCS12}

# 업로드 크기 제한
spring.servlet.multipart.max-file-size=${CHZZK_MAX_UPLOAD_SIZE:2GB}
spring.servlet.multipart.max-request-size=${CHZZK_MAX_UPLOAD_SIZE:2GB}
