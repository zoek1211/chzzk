<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 사용: <section th:replace="~{fragments/comments :: comments('RECORDED', ${broadcast.id})}"></section> (kind: RECORDED | LIVE) -->
<section th:fragment="comments(kind, broadcastId)" id="comments" class="comments"
         th:with="commentList=${@commentService.list(kind, broadcastId)}"
         th:attr="data-kind=${kind},data-broadcast-id=${broadcastId},data-member-id=${currentMember != null ? currentMember.memberId() : ''}">
    <h2>댓글 <span class="meta comment-count" th:text="${#lists.size(commentList)}">0</span></h2>
    <ul class="comment-list">
        <li th:each="c : ${commentList}" class="comment" th:attr="data-comment-id=${c.id}">
            <strong class="comment-author" th:text="${c.authorNickname}">닉네임</strong>
            <time class="meta" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')} + (${c.edited} ? ' (수정됨)' : '')">2026-01-01</time>
            <p class="comment-body" th:text="${c.body}">본문</p>
            <div class="comment-actions" th:if="${currentMember != null and currentMember.memberId() == c.authorId}">
                <details class="comment-edit">
                    <summary>수정</summary>
                    <form method="post" class="form" th:action="@{/comments/{id}/edit(id=${c.id})}">
                        <textarea name="body" rows="3" maxlength="500" required th:text="${c.body}"></textarea>
                        <button type="submit" class="button">저장</button>
                    </form>
                </details>
                <form method="post" th:action="@{/comments/{id}/delete(id=${c.id})}">
                    <button type="submit" class="button">삭제</button>
                </form>
            </div>
        </li>
    </ul>
    <p class="empty comment-empty" th:hidden="${!#lists.isEmpty(commentList)}">아직 댓글이 없습니다.</p>
    <form th:if="${currentMember != null}" method="post" class="form comment-form"
          th:action="${kind == 'LIVE'} ? @{/live/{id}/comments(id=${broadcastId})} : @{/broadcasts/{id}/comments(id=${broadcastId})}">
        <label>
            댓글 쓰기
            <textarea name="body" rows="3" maxlength="500" required></textarea>
        </label>
        <button type="submit" class="button">등록</button>
    </form>
    <p class="meta" th:if="${currentMember == null}">
        <a th:href="@{/login}">로그인하면 댓글을 쓸 수 있습니다</a>
    </p>
    <!-- 라이브 시청 화면: 5초마다 JSON 목록을 읽어 제자리에서 다시 그린다. 사용자 글은 textContent로만 넣는다. 방송이 끝나도 계속 동작한다. -->
    <script th:if="${kind == 'LIVE'}" th:inline="none">
        (function () {
            var root = document.getElementById('comments');
            var list = root.querySelector('.comment-list');
            var count = root.querySelector('.comment-count');
            var empty = root.querySelector('.comment-empty');
            var url = '/live/' + root.dataset.broadcastId + '/comments';
            var last = null;
            var meId = root.dataset.memberId;
            var csrf = document.querySelector('meta[name="_csrf"]');
            function hidden(name, value) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = value;
                return input;
            }
            function actions(c) {
                var box = document.createElement('div');
                box.className = 'comment-actions';
                var details = document.createElement('details');
                details.className = 'comment-edit';
                var summary = document.createElement('summary');
                summary.textContent = '수정';
                var edit = document.createElement('form');
                edit.method = 'post';
                edit.className = 'form';
                edit.action = '/comments/' + c.id + '/edit';
                var area = document.createElement('textarea');
                area.name = 'body';
                area.rows = 3;
                area.maxLength = 500;
                area.required = true;
                area.value = c.body;
                var save = document.createElement('button');
                save.type = 'submit';
                save.className = 'button';
                save.textContent = '저장';
                edit.append(area, save);
                var del = document.createElement('form');
                del.method = 'post';
                del.action = '/comments/' + c.id + '/delete';
                var remove = document.createElement('button');
                remove.type = 'submit';
                remove.className = 'button';
                remove.textContent = '삭제';
                del.append(remove);
                if (csrf) {
                    edit.append(hidden('_csrf', csrf.content));
                    del.append(hidden('_csrf', csrf.content));
                }
                details.append(summary, edit);
                box.append(details, del);
                return box;
            }
            var fmt = new Intl.DateTimeFormat('ko-KR', {
                timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hour12: false
            });
            function render(items) {
                var sig = JSON.stringify(items);
                if (sig === last) { return; }
                last = sig;
                list.replaceChildren();
                items.forEach(function (c) {
                    var li = document.createElement('li');
                    li.className = 'comment';
                    li.dataset.commentId = c.id;
                    var who = document.createElement('strong');
                    who.className = 'comment-author';
                    who.textContent = c.authorNickname;
                    var time = document.createElement('time');
                    time.className = 'meta';
                    time.textContent = fmt.format(new Date(c.createdAt)) + (c.edited ? ' (수정됨)' : '');
                    var body = document.createElement('p');
                    body.className = 'comment-body';
                    body.textContent = c.body;
                    li.append(who, ' ', time, body);
                    if (meId && String(c.authorId) === meId) { li.append(actions(c)); }
                    list.appendChild(li);
                });
                count.textContent = items.length;
                empty.hidden = items.length > 0;
            }
            function poll() {
                fetch(url, {headers: {'Accept': 'application/json'}})
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (items) { if (items) { render(items); } })
                    .catch(function () { /* 다음 주기에 다시 시도 */ });
            }
            setInterval(poll, 5000);
        })();
    </script>
</section>
</body>
</html>
