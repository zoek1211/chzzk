<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · 치지직 다시보기'">치지직 다시보기</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/broadcasts}">치지직 <span>다시보기</span></a>
    <nav class="header-actions">
        <a class="button" th:href="@{/live/new}">라이브 시작</a>
        <a class="button" th:href="@{/broadcasts/new}">녹화방송 등록</a>
        <th:block th:if="${currentMember == null}">
            <a class="button button-secondary" th:href="@{/login}">로그인</a>
            <a class="button button-secondary" th:href="@{/signup}">회원가입</a>
        </th:block>
        <th:block th:if="${currentMember != null}">
            <span class="member-name" th:text="${currentMember.nickname()}">닉네임</span>
            <form method="post" th:action="@{/logout}" class="inline-form">
                <button type="submit" class="button button-secondary">로그아웃</button>
            </form>
        </th:block>
    </nav>
</header>
</body>
</html>
