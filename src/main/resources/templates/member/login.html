<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <h1>로그인</h1>

    <p class="error" role="alert" th:if="${failed}">아이디 또는 비밀번호가 올바르지 않습니다.</p>

    <form method="post" th:action="@{/login}" class="form">
        <label>
            아이디
            <input type="text" name="username" required autocomplete="username">
        </label>
        <label>
            비밀번호
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="button">로그인</button>
    </form>
    <p class="meta">아직 회원이 아니신가요? <a th:href="@{/signup}">회원가입</a></p>
</main>
</body>
</html>
