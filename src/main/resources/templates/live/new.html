<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('송출 화면')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <h1>송출 화면</h1>

    <p class="error" role="alert" id="message" hidden></p>

    <div class="player">
        <video id="preview" autoplay muted playsinline></video>
    </div>

    <button type="button" class="button button-secondary" id="switch-camera-button" hidden>카메라 전환</button>

    <form id="start-form" class="form">
        <label>
            제목
            <input type="text" name="title" maxlength="200" required>
        </label>
        <button type="submit" class="button" id="start-button">방송 시작</button>
    </form>

    <p id="started" class="meta" hidden>
        방송 중입니다. <a id="watch-link" href="#">시청 화면 열기</a>
    </p>
    <button type="button" class="button" id="end-button" hidden>방송 종료</button>
    <p id="ended" class="meta" hidden>방송이 종료되었습니다. 더 이상 영상을 보내지 않습니다.</p>
</main>
<script th:inline="javascript">
window.ICE_SERVERS = JSON.parse(/*[[${iceServersJson}]]*/ '[]');
</script>
<script>
(function () {
    function csrfHeaders(headers) {
        var token = document.querySelector('meta[name="_csrf"]');
        var name = document.querySelector('meta[name="_csrf_header"]');
        if (token && name) {
            headers[name.content] = token.content;
        }
        return headers;
    }

    var message = document.getElementById('message');
    var preview = document.getElementById('preview');
    var form = document.getElementById('start-form');
    var stream = null;
    var liveId = null;
    var endButton = document.getElementById('end-button');

    function show(text) {
        message.textContent = text;
        message.hidden = false;
    }

    var facing = 'user';
    var startButton = document.getElementById('start-button');
    var switchButton = document.getElementById('switch-camera-button');

    // 화질 제한: 최대 1280x720, 30fps.
    function videoConstraints(mode) {
        return { facingMode: mode, width: { max: 1280 }, height: { max: 720 }, frameRate: { max: 30 } };
    }

    function blockStart(text) {
        show(text);
        startButton.disabled = true;
    }

    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        blockStart('카메라와 마이크는 HTTPS(또는 localhost) 주소에서만 사용할 수 있습니다. HTTPS 주소로 다시 열어 주세요.');
    } else {
        navigator.mediaDevices.getUserMedia({ video: videoConstraints(facing), audio: true }).then(function (s) {
            stream = s;
            preview.srcObject = s;
        }).catch(function (e) {
            if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
                blockStart('카메라와 마이크 권한이 거부되었습니다. 주소창 옆 자물쇠(사이트 설정)에서 카메라와 마이크를 허용한 뒤 새로고침해 주세요.');
            } else if (e && e.name === 'NotFoundError') {
                blockStart('카메라 또는 마이크를 찾을 수 없습니다. 기기 연결을 확인한 뒤 새로고침해 주세요.');
            } else {
                blockStart('카메라를 시작하지 못했습니다. 다른 앱이 카메라를 쓰고 있지 않은지 확인한 뒤 새로고침해 주세요.');
            }
        });
    }

    // 전면/후면 전환. 새 영상 트랙을 얻어 모든 시청자 연결의 영상 sender에 갈아 끼우고 옛 트랙은 멈춘다.
    function swapVideoTrack(newTrack) {
        var oldTrack = stream.getVideoTracks()[0];
        if (oldTrack) {
            stream.removeTrack(oldTrack);
            oldTrack.stop();
        }
        stream.addTrack(newTrack);
        preview.srcObject = stream;
        return Promise.all(Object.keys(peers).map(function (id) {
            var sender = peers[id].getSenders().filter(function (s) {
                return s.track && s.track.kind === 'video';
            })[0];
            return sender ? sender.replaceTrack(newTrack) : null;
        }));
    }

    function requestCamera(mode) {
        return navigator.mediaDevices.getUserMedia({ video: videoConstraints(mode) })
            .then(function (s) { return s.getVideoTracks()[0]; });
    }

    switchButton.addEventListener('click', function () {
        if (!stream) { return; }
        var next = facing === 'user' ? 'environment' : 'user';
        switchButton.disabled = true;
        // 일부 폰은 카메라를 동시에 둘 열 수 없으므로 옛 트랙을 먼저 멈춘 뒤 새 카메라를 요청한다.
        stream.getVideoTracks().forEach(function (t) { t.stop(); });
        requestCamera(next).then(function (track) {
            facing = next;
            return swapVideoTrack(track);
        }).catch(function () {
            show('카메라를 전환하지 못했습니다. 이전 카메라로 되돌립니다.');
            return requestCamera(facing).then(swapVideoTrack).catch(function () {
                show('카메라를 다시 켜지 못했습니다. 새로고침 후 방송을 다시 시작해 주세요.');
            });
        }).then(function () {
            switchButton.disabled = false;
        });
    });

    // 시청자마다 피어 연결 하나. 시청자가 들어오면 offer를 만들어 보낸다.
    var peers = {};

    var ws = null;

    // 방송 종료 뒤에는 시그널링 연결과 모든 시청자 피어 연결을 닫는다.
    function closeBroadcast() {
        Object.keys(peers).forEach(function (id) { removeViewer(id); });
        if (ws) {
            ws.onclose = null;
            ws.close();
            ws = null;
        }
    }

    function removeViewer(viewerId) {
        if (peers[viewerId]) {
            peers[viewerId].close();
            delete peers[viewerId];
        }
    }

    function signal(liveId, key) {
        var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
        // 송출 키는 주소(쿼리)에 싣지 않고, 접속 뒤 첫 메시지로 보낸다.
        ws = new WebSocket(scheme + '//' + location.host + '/ws/live/' + liveId + '/broadcaster');
        var socket = ws;
        socket.onopen = function () {
            socket.send(JSON.stringify({ type: 'auth', key: key }));
        };

        function send(payload) {
            socket.send(JSON.stringify(payload));
        }

        function addViewer(viewerId) {
            var pc = new RTCPeerConnection({ iceServers: window.ICE_SERVERS });
            peers[viewerId] = pc;
            stream.getTracks().forEach(function (track) { pc.addTrack(track, stream); });
            pc.onicecandidate = function (event) {
                if (event.candidate) {
                    send({ type: 'candidate', viewerId: viewerId, candidate: event.candidate });
                }
            };
            pc.createOffer().then(function (offer) {
                return pc.setLocalDescription(offer);
            }).then(function () {
                send({ type: 'offer', viewerId: viewerId, sdp: pc.localDescription.sdp });
            });
        }

        var queue = Promise.resolve();
        socket.onmessage = function (event) {
            var msg = JSON.parse(event.data);
            queue = queue.then(function () {
                var pc = peers[msg.viewerId];
                if (msg.type === 'viewer-joined') {
                    addViewer(msg.viewerId);
                } else if (msg.type === 'viewer-left') {
                    removeViewer(msg.viewerId);
                } else if (msg.type === 'answer' && pc) {
                    return pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
                } else if (msg.type === 'candidate' && pc) {
                    return pc.addIceCandidate(msg.candidate);
                }
            }).catch(function (e) { console.warn(e); });
        };
        socket.onclose = function () {
            Object.keys(peers).forEach(removeViewer);
        };
    }

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        message.hidden = true;
        if (!stream) {
            show('카메라와 마이크가 준비되지 않아 방송을 시작할 수 없습니다.');
            return;
        }
        fetch('/live', {
            method: 'POST',
            headers: csrfHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ title: form.title.value })
        }).then(function (response) {
            return response.json().then(function (body) {
                if (!response.ok) {
                    show(body.error || '방송을 시작하지 못했습니다.');
                    return;
                }
                // 송출 키는 이 화면 메모리에만 둔다. 시그널링 접속과 이후 종료에 쓰인다.
                window.broadcastKey = body.broadcastKey;
                signal(body.id, body.broadcastKey);
                liveId = body.id;
                endButton.hidden = false;
                switchButton.hidden = false;
                document.getElementById('watch-link').href = '/live/' + body.id;
                document.getElementById('started').hidden = false;
                document.getElementById('start-button').disabled = true;
                form.title.readOnly = true;
            });
        });
    });

    endButton.addEventListener('click', function () {
        endButton.disabled = true;
        fetch('/live/' + liveId + '/end', {
            method: 'POST',
            headers: csrfHeaders({ 'X-Broadcast-Key': window.broadcastKey })
        }).then(function (response) {
            if (!response.ok) {
                endButton.disabled = false;
                show('방송을 종료하지 못했습니다. 다시 시도해 주세요.');
                return;
            }
            closeBroadcast();
            if (stream) {
                stream.getTracks().forEach(function (track) { track.stop(); });
            }
            preview.srcObject = null;
            endButton.hidden = true;
            switchButton.hidden = true;
            document.getElementById('started').hidden = true;
            document.getElementById('ended').hidden = false;
        }).catch(function () {
            endButton.disabled = false;
            show('방송을 종료하지 못했습니다. 다시 시도해 주세요.');
        });
    });
})();
</script>
</body>
</html>
