<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${live.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1 th:text="${live.title}">제목</h1>
    <p class="meta">
        <span class="badge" id="status-badge" th:classappend="${live.onAir} ? 'badge-live' : 'badge-ended'"
              th:text="${live.status.label}">방송 중</span>
        ·
        <time th:text="${#temporals.format(live.startedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time>
        <span th:if="${live.endedAt != null}">
            ~ <time th:text="${#temporals.format(live.endedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2026-01-01</time>
        </span>
    </p>
    <div class="player" th:if="${live.onAir}">
        <video id="player" autoplay playsinline controls></video>
        <button type="button" class="button unmute-button" id="unmute-button" hidden>음소거 해제</button>
    </div>
    <p class="empty" id="status" th:if="${live.onAir}">방송 연결 중...</p>
    <p class="empty" id="ended-view" th:attr="hidden=${live.onAir} ? 'hidden' : null">방송이 종료되었습니다.</p>
    <th:block th:if="${currentMember != null and live.isOwnedBy(currentMember.memberId())}">
        <button type="button" class="button" id="owner-end-button" th:if="${live.onAir}">방송 종료</button>
        <form method="post" th:action="@{/live/{id}/delete(id=${live.id})}" th:unless="${live.onAir}">
            <button type="submit" class="button button-secondary">삭제</button>
        </form>
    </th:block>
    <section th:replace="~{fragments/comments :: comments('LIVE', ${live.id})}"></section>
    <p><a th:href="@{/broadcasts}">← 목록으로</a></p>
</main>
<script th:if="${live.onAir and currentMember != null and live.isOwnedBy(currentMember.memberId())}">
(function () {
    // 소유자는 어느 기기에서든 자기 라이브를 종료할 수 있다. 화면 전환은 시청자 연결이 받는 종료 알림이 맡는다.
    var button = document.getElementById('owner-end-button');
    var token = document.querySelector('meta[name="_csrf"]');
    var name = document.querySelector('meta[name="_csrf_header"]');
    button.addEventListener('click', function () {
        var headers = {};
        if (token && name) { headers[name.content] = token.content; }
        button.disabled = true;
        fetch(location.pathname + '/end', { method: 'POST', headers: headers }).then(function (response) {
            if (response.ok) {
                button.hidden = true;
            } else {
                button.disabled = false;
            }
        }).catch(function () { button.disabled = false; });
    });
})();
</script>
<script th:if="${live.onAir}" th:inline="javascript">
(function () {
    var liveId = /*[[${live.id}]]*/ 0;
    var iceServers = JSON.parse(/*[[${iceServersJson}]]*/ '[]');
    var player = document.getElementById('player');
    var status = document.getElementById('status');
    var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = new WebSocket(scheme + '//' + location.host + '/ws/live/' + liveId + '/viewer');
    var pc = new RTCPeerConnection({ iceServers: iceServers });

    function send(payload) {
        ws.send(JSON.stringify(payload));
    }

    pc.onicecandidate = function (event) {
        if (event.candidate) {
            send({ type: 'candidate', candidate: event.candidate });
        }
    };
    pc.ontrack = function (event) {
        player.srcObject = event.streams[0];
        status.hidden = true;
        // 자동 재생이 막히면 음소거로 시작한다. 컨트롤로 음소거를 해제할 수 있다.
        player.play().catch(function () {
            player.muted = true;
            player.play();
            unmuteButton.hidden = false;
        });
    };
    var unmuteButton = document.getElementById('unmute-button');
    unmuteButton.addEventListener('click', function () {
        player.muted = false;
        unmuteButton.hidden = true;
    });
    player.addEventListener('volumechange', function () {
        if (!player.muted) { unmuteButton.hidden = true; }
    });

    // 방송이 끝났거나 정원이 찼으면 더는 연결이 끊긴 것으로 보지 않는다.
    var settled = false;

    function stopPlayback() {
        player.pause();
        player.srcObject = null;
        pc.close();
    }

    // 방송이 끝나면 새로고침 없이 영상을 멈추고 종료 안내로 바꾼다.
    function showEnded() {
        settled = true;
        stopPlayback();
        document.querySelector('.player').style.display = 'none';
        status.hidden = true;
        var badge = document.getElementById('status-badge');
        badge.textContent = '종료';
        badge.classList.remove('badge-live');
        badge.classList.add('badge-ended');
        document.getElementById('ended-view').hidden = false;
    }

    // 종료·정원 초과 없이 연결이 끊기면 알리고 다시 연결하도록 안내한다.
    function showDisconnected() {
        if (settled) { return; }
        settled = true;
        stopPlayback();
        status.textContent = '연결이 끊어졌습니다. 페이지를 새로고침해(다시 연결) 주세요.';
        status.hidden = false;
    }
    ws.onclose = showDisconnected;
    ws.onerror = showDisconnected;

    // 메시지를 순서대로 처리한다(offer 처리 전에 candidate가 앞지르지 않도록).
    var queue = Promise.resolve();
    ws.onmessage = function (event) {
        var msg = JSON.parse(event.data);
        if (msg.type === 'full') {
            settled = true;
            status.textContent = '시청자가 가득 찼습니다';
            return;
        }
        if (msg.type === 'ended') {
            showEnded();
            return;
        }
        queue = queue.then(function () {
            if (msg.type === 'offer') {
                return pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp }).then(function () {
                    return pc.createAnswer();
                }).then(function (answer) {
                    return pc.setLocalDescription(answer);
                }).then(function () {
                    send({ type: 'answer', sdp: pc.localDescription.sdp });
                });
            } else if (msg.type === 'candidate') {
                return pc.addIceCandidate(msg.candidate);
            }
        }).catch(function (e) { console.warn(e); });
    };
})();
</script>
</body>
</html>
