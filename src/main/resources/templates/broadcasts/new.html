<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('녹화방송 등록')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <h1>녹화방송 등록</h1>

    <p class="error" role="alert" th:if="${error}" th:text="${error}">오류</p>

    <form method="post" th:action="@{/broadcasts}" enctype="multipart/form-data" class="form">
        <label>
            제목
            <input type="text" name="title" maxlength="200" required th:value="${title}">
        </label>

        <fieldset>
            <legend>영상 (둘 중 하나)</legend>
            <label>
                영상 파일 업로드
                <input type="file" name="videoFile" accept="video/*">
            </label>
            <div class="or">또는</div>
            <label>
                이미 저장된 영상 주소
                <input type="url" name="videoUrl" placeholder="https://example.com/video.mp4" th:value="${videoUrl}">
            </label>
        </fieldset>

        <button type="submit" class="button">등록</button>
    </form>
</main>
</body>
</html>
