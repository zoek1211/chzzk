# 클러스터 모드(SPRING_PROFILES_ACTIVE=cluster): 인스턴스 여러 개가 Postgres·Redis·영상 디렉터리를 공유한다.
# 환경변수 계약은 docs/adr/0004 와 README 5단계 소단원을 따른다.
chzzk.cluster.enabled=true
chzzk.instance-id=${CHZZK_INSTANCE_ID:${HOSTNAME:local}}

# 단독 모드가 제외해 둔 Redis·세션 자동 설정을 되살린다
spring.autoconfigure.exclude=

spring.datasource.url=${CHZZK_DB_URL:jdbc:postgresql://localhost:5432/chzzk}
spring.datasource.username=${CHZZK_DB_USERNAME:chzzk}
spring.datasource.password=${CHZZK_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${CHZZK_REDIS_HOST:redis}
spring.data.redis.port=${CHZZK_REDIS_PORT:6379}

# 로그인 세션은 Redis에 둔다
spring.session.redis.namespace=chzzk:session
# 세션 쿠키 이름은 단독 모드와 같게 둔다(Spring Session 기본값은 SESSION)
server.servlet.session.cookie.name=JSESSIONID
